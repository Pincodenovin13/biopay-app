name: BioPay CI/CD Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Static Analysis, Types & Linting
  # ----------------------------------------------------------------------------
  lint:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Prisma Client
        run: npx --yes prisma generate || true

      - name: TypeScript Compile Check
        run: npm run lint

  # ----------------------------------------------------------------------------
  # Job 2: Automated Testing (Jest Unit & Integration)
  # ----------------------------------------------------------------------------
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Unit Tests
        run: npm test --if-present

  # ----------------------------------------------------------------------------
  # Job 3: Production Build Verification
  # ----------------------------------------------------------------------------
  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      NEXTAUTH_SECRET: "ci-dummy-secret-key-32-characters-minimum"
      CSRF_SECRET: "ci-dummy-csrf-secret-key-32-characters"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Prisma Client
        run: npx --yes prisma generate || true

      - name: Build Application
        run: npm run build
